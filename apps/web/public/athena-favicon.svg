<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Athena">
  <!--
    The Athena mark, as a standalone favicon.

    apps/web/app/layout.tsx has linked /athena-favicon.svg since the fork was branded, and the file
    did not exist — every page load asked for it and got a 404, and the browser fell back to Plane's
    PNG. Drawn rather than exported from a raster: a favicon has to hold together at 16 pixels, and
    a shape made of arcs and straight edges does that where a downscaled image does not.

    Geometry matches athena/components/AthenaLogo.tsx exactly, so the tab icon and the in-app mark
    are the same drawing. The rounded square behind it is what makes it readable on both a light and
    a dark browser chrome — an unbacked glyph disappears into one of them.
  -->
  <rect width="40" height="40" rx="9" fill="#006B4F"/>
  <g transform="translate(20 20) scale(0.74) translate(-20 -20)">
    <!-- head -->
    <path
      d="M20 3C11.716 3 5 9.716 5 18v6a4 4 0 0 0 4 4h1.2l2.4 6.2a1 1 0 0 0 1.86.06L16.6 28h6.8l2.14 6.26a1 1 0 0 0 1.86-.06L29.8 28H31a4 4 0 0 0 4-4v-6c0-8.284-6.716-15-15-15Z"
      fill="#FFFFFF"/>
    <!-- ear tufts -->
    <path d="M9 8 5 2l6.2 2.4L9 8Z" fill="#FFFFFF"/>
    <path d="M31 8 35 2l-6.2 2.4L31 8Z" fill="#FFFFFF"/>
    <!-- eyes, cut back to the field colour -->
    <circle cx="14.5" cy="18" r="4" fill="#006B4F"/>
    <circle cx="25.5" cy="18" r="4" fill="#006B4F"/>
    <circle cx="14.5" cy="18" r="1.6" fill="#FFFFFF"/>
    <circle cx="25.5" cy="18" r="1.6" fill="#FFFFFF"/>
    <!-- beak -->
    <path d="M18.6 21.5h2.8L20 24.6l-1.4-3.1Z" fill="#006B4F"/>
  </g>
</svg>
